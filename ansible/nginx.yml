---
- name: Configure Nginx reverse proxy for production
  hosts: production
  become: true
  gather_facts: true
  vars:
    geocontext_domain: geocontext.app
    geocontext_alt_domains:
      - www.geocontext.app

  tasks:
    - name: Stop unattended apt background services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service
      failed_when: false

    - name: Wait for apt/dpkg lock release
      ansible.builtin.command: >-
        bash -lc '! fuser /var/lib/dpkg/lock >/dev/null 2>&1
        && ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1
        && ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1
        && ! fuser /var/cache/apt/archives/lock >/dev/null 2>&1'
      register: apt_lock_check
      changed_when: false
      retries: 120
      delay: 5
      until: apt_lock_check.rc == 0

    - name: Create ACME challenge webroot
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Install Nginx from Ubuntu repositories.
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        lock_timeout: 600

    # Ensure service is enabled across VM reboots.
    - name: Enable Nginx service
      ansible.builtin.service:
        name: nginx
        enabled: true

    # Remove default site to avoid conflicts with GeoContext.
    - name: Remove enabled default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Remove available default site
      ansible.builtin.file:
        path: /etc/nginx/sites-available/default
        state: absent

    # Render main HTTP server block for production.
    - name: Render GeoContext Nginx configuration
      ansible.builtin.template:
        src: templates/geocontext-nginx.conf.j2
        dest: /etc/nginx/sites-available/geocontext.conf
        owner: root
        group: root
        mode: "0644"

    # Enable server block via symbolic link.
    - name: Enable GeoContext site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/geocontext.conf
        dest: /etc/nginx/sites-enabled/geocontext.conf
        state: link

    # Validate syntax before restart.
    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    # Restart to apply new configuration.
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
