---
- name: Enable HTTPS with Let's Encrypt in production
  hosts: production
  become: true
  gather_facts: true

  vars:
    geocontext_domain: geocontext.app
    geocontext_alt_domains:
      - www.geocontext.app
    letsencrypt_email: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_EMAIL') | default('admin@geocontext.app', true) }}"
    certbot_webroot: /var/www/certbot

  tasks:
    - name: Stop unattended apt background services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service
      failed_when: false

    - name: Wait for apt/dpkg lock release
      ansible.builtin.command: >-
        bash -lc '! fuser /var/lib/dpkg/lock >/dev/null 2>&1
        && ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1
        && ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1
        && ! fuser /var/cache/apt/archives/lock >/dev/null 2>&1'
      register: apt_lock_check
      changed_when: false
      retries: 120
      delay: 5
      until: apt_lock_check.rc == 0

    # Validate minimum settings required for certificate issuance.
    - name: Validate Let's Encrypt email
      ansible.builtin.assert:
        that:
          - letsencrypt_email is string
          - "'@' in letsencrypt_email"
        fail_msg: "Set a valid letsencrypt_email value (example: ops@geocontext.app)."

    # Install Certbot and Nginx plugin.
    - name: Install Certbot and Nginx plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true
        lock_timeout: 600

    # Ensure Nginx is running before requesting certificates.
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Validate Nginx running state
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "Nginx is not running. Run ansible/nginx.yml before ansible/https.yml."

    # Validate DNS resolution for root and www domains from EC2.
    - name: Validate DNS resolution for geocontext.app
      ansible.builtin.command: getent hosts {{ geocontext_domain }}
      register: dns_root_check
      changed_when: false

    - name: Validate DNS resolution for www.geocontext.app
      ansible.builtin.command: getent hosts {{ geocontext_alt_domains[0] }}
      register: dns_www_check
      changed_when: false

    - name: Create ACME challenge webroot
      ansible.builtin.file:
        path: "{{ certbot_webroot }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Issue (or renew) certificate for root and alternate domains.
    - name: Request/renew Let's Encrypt certificate via webroot
      ansible.builtin.command: >-
        certbot certonly --webroot -w {{ certbot_webroot }}
        -d {{ geocontext_domain }}
        {% for domain in geocontext_alt_domains %}-d {{ domain }} {% endfor %}
        --email {{ letsencrypt_email }} --agree-tos --non-interactive --keep-until-expiring
      register: certbot_result
      changed_when: >-
        ('Successfully received certificate' in certbot_result.stdout) or
        ('Congratulations' in certbot_result.stdout)

    # Render Nginx TLS configuration with HTTP to HTTPS redirect.
    - name: Render GeoContext HTTPS Nginx configuration
      ansible.builtin.template:
        src: templates/geocontext-nginx-https.conf.j2
        dest: /etc/nginx/sites-available/geocontext.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Restart Nginx to apply TLS
      ansible.builtin.service:
        name: nginx
        state: restarted

    # Verify HTTPS endpoint responds from within the instance.
    - name: Verify HTTPS endpoint for geocontext.app
      ansible.builtin.uri:
        url: https://{{ geocontext_domain }}
        method: GET
        status_code: [200, 301, 302]
        validate_certs: true

    # Certbot installs an automatic timer; ensure it remains enabled.
    - name: Enable Certbot auto-renew timer
      ansible.builtin.service:
        name: certbot.timer
        enabled: true
        state: started

    - name: Create renewal hook to reload Nginx
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          systemctl reload nginx

    # Validate auto-renew flow without consuming real issuance quota.
    - name: Test certificate auto-renew flow (dry-run)
      ansible.builtin.command: certbot renew --dry-run
      register: certbot_dry_run_result
      retries: 3
      delay: 20
      until: certbot_dry_run_result.rc == 0
      failed_when: >-
        certbot_dry_run_result.rc != 0 and
        ('rateLimited' not in (certbot_dry_run_result.stderr | default(''))) and
        ('Service busy; retry later' not in (certbot_dry_run_result.stderr | default('')))
      changed_when: false

    - name: Warn when dry-run hits temporary rate limit
      ansible.builtin.debug:
        msg: >-
          Certbot dry-run returned a temporary Let's Encrypt rate limit.
          The active certificate remains valid; retry later.
      when: >-
        certbot_dry_run_result.rc != 0 and (
          'rateLimited' in (certbot_dry_run_result.stderr | default('')) or
          'Service busy; retry later' in (certbot_dry_run_result.stderr | default(''))
        )
