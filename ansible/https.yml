---
- name: Habilitar HTTPS con Let's Encrypt en production
  hosts: production
  become: true
  gather_facts: true

  vars:
    geocontext_domain: geocontext.app
    geocontext_alt_domains:
      - www.geocontext.app
    letsencrypt_email: "{{ lookup('ansible.builtin.env', 'LETSENCRYPT_EMAIL') | default('admin@geocontext.app', true) }}"
    certbot_webroot: /var/www/certbot

  tasks:
    # Verifica configuración mínima requerida para solicitar certificados.
    - name: Validar email para Let's Encrypt
      ansible.builtin.assert:
        that:
          - letsencrypt_email is string
          - "'@' in letsencrypt_email"
        fail_msg: "Define letsencrypt_email válido (ejemplo: ops@geocontext.app)."

    # Instala Certbot y plugin de Nginx como solicita el requerimiento.
    - name: Instalar certbot y plugin nginx
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true

    # Confirma que Nginx esté activo antes de emitir certificados.
    - name: Verificar que nginx esté activo
      ansible.builtin.service_facts:

    - name: Validar estado running de nginx
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service'].state == 'running'
        fail_msg: "Nginx no está corriendo. Ejecuta ansible/nginx.yml antes de HTTPS."

    # Verifica resolución DNS para dominio raíz y www desde la EC2.
    - name: Validar resolución DNS de geocontext.app
      ansible.builtin.command: getent hosts {{ geocontext_domain }}
      register: dns_root_check
      changed_when: false

    - name: Validar resolución DNS de www.geocontext.app
      ansible.builtin.command: getent hosts {{ geocontext_alt_domains[0] }}
      register: dns_www_check
      changed_when: false

    - name: Crear webroot para desafíos ACME
      ansible.builtin.file:
        path: "{{ certbot_webroot }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Emite (o renueva) certificado para dominio principal y alterno.
    - name: Solicitar/renovar certificado Let's Encrypt por webroot
      ansible.builtin.command: >-
        certbot certonly --webroot -w {{ certbot_webroot }}
        -d {{ geocontext_domain }}
        {% for domain in geocontext_alt_domains %}-d {{ domain }} {% endfor %}
        --email {{ letsencrypt_email }} --agree-tos --non-interactive --keep-until-expiring
      register: certbot_result
      changed_when: >-
        ('Successfully received certificate' in certbot_result.stdout) or
        ('Congratulations' in certbot_result.stdout)

    # Instala configuración TLS de Nginx con redirect 80 -> 443.
    - name: Renderizar configuración HTTPS de GeoContext
      ansible.builtin.template:
        src: templates/geocontext-nginx-https.conf.j2
        dest: /etc/nginx/sites-available/geocontext.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validar configuración de nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reiniciar nginx para aplicar TLS
      ansible.builtin.service:
        name: nginx
        state: restarted

    # Comprueba que HTTPS responda correctamente desde la propia instancia.
    - name: Verificar endpoint HTTPS de geocontext.app
      ansible.builtin.uri:
        url: https://{{ geocontext_domain }}
        method: GET
        status_code: [200, 301, 302]
        validate_certs: true

    # Certbot instala timer automático; se fuerza habilitado para renovación continua.
    - name: Habilitar timer de renovación automática de certbot
      ansible.builtin.service:
        name: certbot.timer
        enabled: true
        state: started

    - name: Crear hook de renovación para recargar nginx
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          systemctl reload nginx

    # Valida el flujo de renovación automática sin consumir cuota real.
    - name: Probar renovación automática de certificados (dry-run)
      ansible.builtin.command: certbot renew --dry-run
      register: certbot_dry_run_result
      retries: 3
      delay: 20
      until: certbot_dry_run_result.rc == 0
      failed_when: >-
        certbot_dry_run_result.rc != 0 and
        ('rateLimited' not in (certbot_dry_run_result.stderr | default(''))) and
        ('Service busy; retry later' not in (certbot_dry_run_result.stderr | default('')))
      changed_when: false

    - name: Avisar si dry-run no bloqueante por rate limit temporal
      ansible.builtin.debug:
        msg: >-
          Certbot dry-run devolvió rate limit temporal de Let's Encrypt.
          El certificado activo sigue válido; reintentar más tarde.
      when: >-
        certbot_dry_run_result.rc != 0 and (
          'rateLimited' in (certbot_dry_run_result.stderr | default('')) or
          'Service busy; retry later' in (certbot_dry_run_result.stderr | default(''))
        )
