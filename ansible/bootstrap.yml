---
- name: Bootstrap baseline for production EC2 (Ubuntu 24.04)
  hosts: production
  become: true
  gather_facts: true

  vars:
    docker_apt_key_url: "https://download.docker.com/linux/ubuntu/gpg"
    docker_apt_keyring_path: "/etc/apt/keyrings/docker.asc"
    docker_apt_repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable

  tasks:
    - name: Stop unattended apt background services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service
      failed_when: false

    - name: Wait for apt/dpkg lock release
      ansible.builtin.command: >-
        bash -lc '! fuser /var/lib/dpkg/lock >/dev/null 2>&1
        && ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1
        && ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1
        && ! fuser /var/cache/apt/archives/lock >/dev/null 2>&1'
      register: apt_lock_check
      changed_when: false
      retries: 120
      delay: 5
      until: apt_lock_check.rc == 0

    # Update apt index from a known-good baseline.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    # Install base dependencies for server administration.
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        lock_timeout: 600

    # Create standard directory for apt repository keyrings.
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # Download official Docker GPG key.
    - name: Download official Docker GPG key
      ansible.builtin.get_url:
        url: "{{ docker_apt_key_url }}"
        dest: "{{ docker_apt_keyring_path }}"
        mode: "0644"

    # Register official Docker repository for Ubuntu.
    - name: Configure official Docker repository
      ansible.builtin.apt_repository:
        repo: "{{ docker_apt_repo }}"
        filename: docker
        state: present

    # Refresh apt cache after adding Docker repository.
    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 600

    # Install Docker Engine, CLI, and required plugins.
    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        lock_timeout: 600

    # Ensure Docker service is running and enabled after reboot.
    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    # Allow Docker usage without sudo for ubuntu user.
    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # Quick validation of Docker installation.
    - name: Validate docker --version
      ansible.builtin.command: docker --version
      changed_when: false
      register: docker_version_cmd

    # Quick validation of Docker Compose plugin.
    - name: Validate docker compose version
      ansible.builtin.command: docker compose version
      changed_when: false
      register: docker_compose_version_cmd

    - name: Display installed versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version_cmd.stdout }}"
          - "{{ docker_compose_version_cmd.stdout }}"
