name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 production
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      INTERNAL_ADMIN_TOKEN: ${{ secrets.INTERNAL_ADMIN_TOKEN }}
      ADMIN_PANEL_USER: ${{ secrets.ADMIN_PANEL_USER }}
      ADMIN_PANEL_PASSWORD: ${{ secrets.ADMIN_PANEL_PASSWORD }}
      ETL_SCHEDULE_CRON: ${{ secrets.ETL_SCHEDULE_CRON }}
      ETL_TIMEZONE: ${{ secrets.ETL_TIMEZONE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible --version

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p "${HOME}/.ssh"
          SSH_KEY_PATH="${HOME}/.ssh/tfm-production"
          printf '%s\n' "${EC2_SSH_KEY}" > "${SSH_KEY_PATH}"
          chmod 600 "${SSH_KEY_PATH}"
          echo "SSH_KEY_PATH=${SSH_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan -H "${EC2_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Run production deploy playbook
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/nginx.yml \
            -e "ansible_host=${EC2_HOST}" \
            -e "ansible_user=${EC2_USER}" \
            -e "ansible_ssh_private_key_file=${SSH_KEY_PATH}"

          ansible-playbook -i ansible/inventory.ini ansible/https.yml \
            -e "ansible_host=${EC2_HOST}" \
            -e "ansible_user=${EC2_USER}" \
            -e "ansible_ssh_private_key_file=${SSH_KEY_PATH}"

          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e "ansible_host=${EC2_HOST}" \
            -e "ansible_user=${EC2_USER}" \
            -e "ansible_ssh_private_key_file=${SSH_KEY_PATH}"
